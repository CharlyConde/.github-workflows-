name: Actualizador Diario Biwenger

on:
  schedule:
    # Se ejecuta a las 07:00 UTC (9:00 AM hora peninsular española)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Ejecutar script extractor
      env:
        BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
        BIWENGER_LEAGUE: ${{ secrets.BIWENGER_LEAGUE }}
        BIWENGER_USER: ${{ secrets.BIWENGER_USER }}
      run: python extractor.py

    - name: Guardar cambios en GitHub
      run: |
        git config --global user.name 'Biwenger Bot'
        git config --global user.email 'bot@biwenger.com'
        git add historial_biwenger_completo.csv
        git commit -m "Auto-update: Datos del mercado actualizados" || exit 0
        git push
