name: Actualizador Diario Biwenger

on:
  schedule:
    - cron: '0 6 * * *'  # Todos los días a las 8:00 AM hora española
  workflow_dispatch:      # Para poder lanzarlo manualmente cuando quieras

permissions:
  contents: write         # <-- ESTO ES CLAVE PARA QUE PUEDA GUARDAR EL CSV SOLO

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas requests openpyxl

      - name: Ejecutar script extractor
        run: python extractor.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_biwenger_completo.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Datos del mercado actualizados" && git push)
