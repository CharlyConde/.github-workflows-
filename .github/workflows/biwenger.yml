name: Actualizador Diario Biwenger

on:
  schedule:
    # Se ejecuta a las 07:00 UTC (8:00 AM hora peninsular española)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

# PERMISO CLAVE: OBLIGATORIO PARA PODER HACER GIT PUSH
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl

    - name: Ejecutar script extractor
      env:
        BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
        BIWENGER_LEAGUE: ${{ secrets.BIWENGER_LEAGUE }}
        BIWENGER_USER: ${{ secrets.BIWENGER_USER }}
      run: python extractor.py

    - name: Guardar cambios en GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git diff-index --quiet HEAD || git commit -m "Auto-update: Datos del mercado actualizados"
        git push
