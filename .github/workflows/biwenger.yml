name: Actualizador Diario Biwenger

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 08:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Ejecutar script de extracción
        env:
          BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
          BIWENGER_LEAGUE: ${{ secrets.BIWENGER_LEAGUE }}
          BIWENGER_USER: ${{ secrets.BIWENGER_USER }}
        run: python extractor.py

      - name: Guardar y commitear cambios en el CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_biwenger_completo.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática del histórico Biwenger" && git push)
